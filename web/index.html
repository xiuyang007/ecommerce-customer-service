<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电商智能客服</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --panel: rgba(15, 29, 49, .88);
      --panel-soft: rgba(25, 44, 70, .72);
      --line: rgba(148, 163, 184, .2);
      --text: #e6edf7;
      --muted: #9badc5;
      --accent: #57b6ff;
      --accent-strong: #2d8cf0;
      --user: #1d5d98;
      --assistant: #142941;
      --danger: #ff8e8e;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font: 15px/1.6 Inter, "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(45, 140, 240, .2), transparent 34%),
        radial-gradient(circle at 95% 100%, rgba(87, 182, 255, .12), transparent 30%),
        var(--bg);
    }

    .shell { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
    .app-card {
      min-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
      backdrop-filter: blur(18px);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 26px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .logo {
      display: grid;
      place-items: center;
      width: 44px; height: 44px;
      border-radius: 14px;
      color: #fff;
      font-size: 22px;
      background: linear-gradient(135deg, var(--accent-strong), #6b63ff);
      box-shadow: 0 10px 26px rgba(45, 140, 240, .3);
    }
    h1 { margin: 0; font-size: 19px; letter-spacing: .02em; }
    .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    button { font: inherit; cursor: pointer; }
    .ghost {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
    }
    .ghost:hover { color: var(--text); border-color: rgba(87, 182, 255, .65); }

    .mode-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 26px 0;
      border-bottom: 1px solid var(--line);
    }
    .mode-button {
      padding: 9px 14px;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      background: transparent;
    }
    .mode-button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .messages[hidden], .composer-wrap[hidden], .extract-panel[hidden], .database-panel[hidden] { display: none; }
    .extract-panel {
      flex: 1;
      padding: 28px 26px;
      overflow-y: auto;
    }
    .extract-title { margin: 0 0 6px; font-size: 18px; }
    .extract-description { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .extract-input {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 13px 14px;
      color: var(--text);
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: rgba(6, 16, 30, .7);
    }
    .extract-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(87, 182, 255, .12); }
    .extract-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .extract-button { min-width: 110px; height: 44px; }
    .extract-result {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 22px 0 0;
    }
    .result-card { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel-soft); }
    .result-card dt { color: var(--muted); font-size: 12px; }
    .result-card dd { min-height: 25px; margin: 4px 0 0; word-break: break-word; }
    .database-panel {
      flex: 1;
      padding: 24px 26px 28px;
      overflow-y: auto;
    }
    .database-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .database-title { margin: 0; font-size: 18px; }
    .database-description { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .database-grid { display: grid; gap: 16px; }
    .database-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(13, 27, 46, .72);
    }
    .database-card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .database-card h3 { margin: 0; font-size: 15px; }
    .database-count { color: var(--muted); font-size: 11px; }
    .table-scroll { overflow: auto; max-height: 330px; border: 1px solid var(--line); border-radius: 6px; }
    .database-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 12px; }
    .database-table th, .database-table td {
      max-width: 280px;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid rgba(148, 163, 184, .14);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .database-table th { position: sticky; top: 0; z-index: 1; color: #cfe9ff; background: #12263e; }
    .database-table tr:last-child td { border-bottom: 0; }
    .database-empty { padding: 18px; color: var(--muted); text-align: center; }
    .citation-ref {
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      margin: 0 2px;
      padding: 0 4px;
      border: 1px solid rgba(87, 182, 255, .45);
      border-radius: 999px;
      color: #cfe9ff;
      background: rgba(45, 140, 240, .16);
      font-size: 10px;
      line-height: 1;
      vertical-align: middle;
      cursor: pointer;
    }
    .citation-ref:hover { background: rgba(45, 140, 240, .3); }
    .feedback-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    .feedback-button {
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font: inherit;
    }
    .feedback-button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
    .feedback-button.selected { color: #fff; border-color: var(--accent); background: rgba(45, 140, 240, .24); }
    .feedback-button:disabled { cursor: default; opacity: .72; }

    .source-dialog {
      width: min(720px, calc(100% - 32px));
      max-height: 82vh;
      padding: 0;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0d1b2e;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .48);
    }
    .source-dialog::backdrop { background: rgba(2, 8, 18, .72); backdrop-filter: blur(3px); }
    .source-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .source-dialog-title { margin: 0; font-size: 16px; }
    .source-close { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: transparent; }
    .source-dialog-body { padding: 18px; overflow-y: auto; }
    .source-path { margin-bottom: 12px; color: var(--accent); font-size: 12px; }
    .source-text { margin: 0; white-space: pre-wrap; line-height: 1.75; }
    .source-uri { display: block; margin-top: 14px; color: var(--muted); font-size: 11px; word-break: break-all; }
    .messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 360px;
      padding: 26px;
      overflow-y: auto;
    }
    .welcome {
      max-width: 640px;
      margin: auto;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(18, 36, 59, .36);
    }
    .welcome strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 20px; }
    .message-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
    .message-row.user { justify-content: flex-end; }
    .avatar {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 32px; height: 32px;
      border-radius: 10px;
      color: #cfe9ff;
      background: var(--panel-soft);
      font-size: 13px;
    }
    .user .avatar { order: 2; color: #fff; background: var(--user); }
    .bubble {
      max-width: min(720px, 82%);
      min-width: 0;
      padding: 11px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--assistant);
    }
    .user .bubble { border-color: rgba(87, 182, 255, .32); background: var(--user); }
    .bubble.pending::after { content: "▌"; margin-left: 2px; color: var(--accent); animation: blink .8s infinite; }
    .tool-trace {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: calc(100% - 42px);
      margin-left: 42px;
    }
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border: 1px solid rgba(87, 182, 255, .35);
      border-radius: 999px;
      color: #cfe9ff;
      background: rgba(45, 140, 240, .12);
      font-size: 11px;
    }
    .tool-badge.running { color: #f4d58d; border-color: rgba(244, 213, 141, .35); }
    .tool-badge.error { color: var(--danger); border-color: rgba(255, 142, 142, .4); }
    @keyframes blink { 50% { opacity: 0; } }

    .composer-wrap { padding: 18px 26px 22px; border-top: 1px solid var(--line); }
    .status { min-height: 22px; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .status.error { color: var(--danger); }
    .composer { display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1;
      min-height: 50px;
      max-height: 150px;
      resize: vertical;
      padding: 13px 14px;
      color: var(--text);
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: rgba(6, 16, 30, .7);
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(87, 182, 255, .12); }
    .send {
      min-width: 82px;
      height: 50px;
      padding: 0 18px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent-strong), #4c79ff);
    }
    .send:hover { filter: brightness(1.08); }
    .send:disabled, textarea:disabled { cursor: not-allowed; opacity: .55; }
    .hint { margin: 8px 2px 0; color: var(--muted); font-size: 11px; }

    @media (max-width: 640px) {
      .shell { width: 100%; padding: 0; }
      .app-card { min-height: 100vh; border: 0; border-radius: 0; }
      header, .messages, .composer-wrap { padding-left: 16px; padding-right: 16px; }
      .bubble { max-width: 86%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="app-card" aria-label="电商智能客服">
      <header>
        <div class="brand">
          <div class="logo" aria-hidden="true">✦</div>
          <div>
            <h1>电商智能客服</h1>
            <p class="subtitle">DeepSeek Flash · Function Calling</p>
          </div>
        </div>
        <button id="clearSession" class="ghost" type="button">新建会话</button>
      </header>

      <nav class="mode-tabs" aria-label="功能模式">
        <button id="chatMode" class="mode-button active" type="button" aria-selected="true">对话</button>
        <button id="extractMode" class="mode-button" type="button" aria-selected="false">售后提取</button>
        <button id="databaseMode" class="mode-button" type="button" aria-selected="false">数据表</button>
      </nav>

      <section id="messages" class="messages" aria-live="polite">
        <div id="welcome" class="welcome">
          <strong>您好，我是智能客服</strong>
          可以咨询商品、物流或售后问题。暂时不会直接操作真实订单；如果需要办理售后，我会先帮您整理必要信息。
        </div>
      </section>

      <section id="extractPanel" class="extract-panel" hidden>
        <h2 class="extract-title">售后信息提取</h2>
        <p class="extract-description">粘贴用户的售后描述，提取订单号、诉求类型和期望方案。</p>
        <textarea id="extractInput" class="extract-input" maxlength="16000" placeholder="例如：订单 A202609130001，耳机左边没有声音，我想换一个新的。" aria-label="售后描述"></textarea>
        <div class="extract-actions">
          <button id="extractButton" class="send extract-button" type="button">开始提取</button>
        </div>
        <div id="extractStatus" class="status" role="status"></div>
        <dl id="extractResult" class="extract-result" hidden>
          <div class="result-card"><dt>订单号</dt><dd id="resultOrderId">—</dd></div>
          <div class="result-card"><dt>诉求类型</dt><dd id="resultRequestType">—</dd></div>
          <div class="result-card"><dt>期望方案</dt><dd id="resultSolution">—</dd></div>
        </dl>
      </section>

      <section id="databasePanel" class="database-panel" hidden>
        <div class="database-header">
          <div>
            <h2 class="database-title">数据库表</h2>
            <p class="database-description">只读展示 MySQL 中业务表的最近记录。</p>
          </div>
          <button id="refreshTables" class="ghost" type="button">刷新</button>
        </div>
        <div id="databaseStatus" class="status" role="status"></div>
        <div id="databaseGrid" class="database-grid"></div>
      </section>

      <div id="composerWrap" class="composer-wrap">
        <div id="status" class="status" role="status"></div>
        <form id="composer" class="composer">
          <textarea id="input" maxlength="8000" placeholder="请输入您的问题…" aria-label="消息输入框"></textarea>
          <button id="send" class="send" type="submit">发送</button>
        </form>
        <div class="hint">Enter 发送 · Shift + Enter 换行</div>
      </div>
    </section>
  </main>

  <dialog id="sourceDialog" class="source-dialog">
    <div class="source-dialog-header">
      <h2 id="sourceTitle" class="source-dialog-title">来源原文</h2>
      <button id="closeSource" class="source-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="source-dialog-body">
      <div id="sourcePath" class="source-path"></div>
      <p id="sourceText" class="source-text"></p>
      <span id="sourceUri" class="source-uri"></span>
    </div>
  </dialog>

  <script>
    const SESSION_KEY = "ecommerce_customer_service_session_id";
    const CHAT_HISTORY_KEY = "ecommerce_customer_service_chat_history";
    const messages = document.querySelector("#messages");
    const welcome = document.querySelector("#welcome");
    const status = document.querySelector("#status");
    const input = document.querySelector("#input");
    const send = document.querySelector("#send");
    const composer = document.querySelector("#composer");
    const composerWrap = document.querySelector("#composerWrap");
    const clearSession = document.querySelector("#clearSession");
    const chatMode = document.querySelector("#chatMode");
    const extractMode = document.querySelector("#extractMode");
    const databaseMode = document.querySelector("#databaseMode");
    const extractPanel = document.querySelector("#extractPanel");
    const extractInput = document.querySelector("#extractInput");
    const extractButton = document.querySelector("#extractButton");
    const extractStatus = document.querySelector("#extractStatus");
    const extractResult = document.querySelector("#extractResult");
    const resultOrderId = document.querySelector("#resultOrderId");
    const resultRequestType = document.querySelector("#resultRequestType");
    const resultSolution = document.querySelector("#resultSolution");
    const databasePanel = document.querySelector("#databasePanel");
    const refreshTables = document.querySelector("#refreshTables");
    const databaseStatus = document.querySelector("#databaseStatus");
    const databaseGrid = document.querySelector("#databaseGrid");
    const sourceDialog = document.querySelector("#sourceDialog");
    const sourceTitle = document.querySelector("#sourceTitle");
    const sourcePath = document.querySelector("#sourcePath");
    const sourceText = document.querySelector("#sourceText");
    const sourceUri = document.querySelector("#sourceUri");
    const closeSource = document.querySelector("#closeSource");

    let sessionId = localStorage.getItem(SESSION_KEY);
    let assistantBubble = null;
    let currentRequestId = "";
    let currentCitations = [];

    function setStatus(text = "", isError = false) {
      status.textContent = text;
      status.classList.toggle("error", isError);
    }

    function saveChatHistory() {
      const history = [...messages.querySelectorAll(".message-row")].map((row) => {
        const bubble = row.querySelector(".bubble");
        let citations = [];
        try { citations = JSON.parse(bubble?.dataset.citations || "[]"); } catch {}
        return {
          role: row.classList.contains("user") ? "user" : "assistant",
          text: bubble?.dataset.rawText || bubble?.textContent || "",
          citations,
          feedback: bubble?.dataset.feedback || "",
          requestId: bubble?.dataset.requestId || "",
        };
      });
      localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(history));
    }

    function openSourceDialog(citation) {
      sourceTitle.textContent = `来源 [${citation.n}]`;
      sourcePath.textContent = Array.isArray(citation.section_path) && citation.section_path.length
        ? citation.section_path.join(" / ")
        : "未提供章节路径";
      sourceText.textContent = citation.answer || "";
      sourceUri.textContent = citation.source_uri || "";
      sourceDialog.showModal();
    }

    function attachFeedback(bubble) {
      if (bubble.querySelector(".feedback-row")) return;
      const feedback = document.createElement("div");
      feedback.className = "feedback-row";
      const label = document.createElement("span");
      label.textContent = "这条回答有帮助吗？";
      const up = document.createElement("button");
      up.className = "feedback-button";
      up.type = "button";
      up.dataset.value = "up";
      up.textContent = "👍 有帮助";
      const down = document.createElement("button");
      down.className = "feedback-button";
      down.type = "button";
      down.dataset.value = "down";
      down.textContent = "👎 未解决";
      feedback.append(label, up, down);
      bubble.appendChild(feedback);
      feedback.addEventListener("click", (event) => {
        const button = event.target.closest(".feedback-button");
        if (!button || bubble.dataset.feedback) return;
        bubble.dataset.feedback = button.dataset.value;
        feedback.querySelectorAll(".feedback-button").forEach((item) => {
          item.disabled = true;
          item.classList.toggle("selected", item === button);
        });
        label.textContent = "已反馈";
        saveChatHistory();
      });
    }

    function renderAssistantBubble(bubble) {
      const text = bubble.dataset.rawText || "";
      let citations = [];
      try { citations = JSON.parse(bubble.dataset.citations || "[]"); } catch {}
      bubble.replaceChildren();
      if (!citations.length) {
        bubble.textContent = text;
      } else {
        const citationMap = new Map(citations.map((item) => [Number(item.n), item]));
        const pattern = /\[(\d+)\]/g;
        let cursor = 0;
        let match;
        while ((match = pattern.exec(text)) !== null) {
          if (match.index > cursor) bubble.appendChild(document.createTextNode(text.slice(cursor, match.index)));
          const number = Number(match[1]);
          if (citationMap.has(number)) {
            const button = document.createElement("button");
            button.className = "citation-ref";
            button.type = "button";
            button.textContent = number;
            button.title = `查看来源 [${number}]`;
            button.addEventListener("click", () => openSourceDialog(citationMap.get(number)));
            bubble.appendChild(button);
          } else {
            bubble.appendChild(document.createTextNode(match[0]));
          }
          cursor = pattern.lastIndex;
        }
        if (cursor < text.length) bubble.appendChild(document.createTextNode(text.slice(cursor)));
      }
      const savedFeedback = bubble.dataset.feedback;
      attachFeedback(bubble);
      if (savedFeedback) {
        const selected = bubble.querySelector(`.feedback-button[data-value="${savedFeedback}"]`);
        bubble.querySelectorAll(".feedback-button").forEach((item) => {
          item.disabled = true;
          item.classList.toggle("selected", item === selected);
        });
        const label = bubble.querySelector(".feedback-row span");
        if (label) label.textContent = "已反馈";
      }
    }

    function addMessage(role, text = "", persist = true, metadata = {}) {
      welcome.hidden = true;
      const row = document.createElement("div");
      row.className = `message-row ${role}`;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "我" : "客";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.dataset.rawText = text;
      bubble.dataset.citations = JSON.stringify(metadata.citations || []);
      bubble.dataset.feedback = metadata.feedback || "";
      if (metadata.requestId) bubble.dataset.requestId = metadata.requestId;
      if (role === "assistant") renderAssistantBubble(bubble);
      else bubble.textContent = text;
      row.append(avatar, bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      if (persist) saveChatHistory();
      return bubble;
    }

    function restoreChatHistory() {
      try {
      const history = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || "[]");
        if (!Array.isArray(history)) return;
        history
          .filter((item) => (item?.role === "user" || item?.role === "assistant") && typeof item.text === "string")
          .forEach((item) => addMessage(item.role, item.text, false, item));
      } catch {
        localStorage.removeItem(CHAT_HISTORY_KEY);
      }
    }

    function setBusy(busy) {
      input.disabled = busy;
      send.disabled = busy;
      clearSession.disabled = busy;
    }

    closeSource.addEventListener("click", () => sourceDialog.close());

    function ensureAssistantBubble() {
      if (!assistantBubble) {
        assistantBubble = addMessage("assistant");
        assistantBubble.classList.add("pending");
      }
      return assistantBubble;
    }

    function appendToolBadge(name, status = "running", step = 1, callId = "") {
      const bubble = ensureAssistantBubble();
      const row = bubble.parentElement;
      let trace = row.querySelector(".tool-trace");
      if (!trace) {
        trace = document.createElement("div");
        trace.className = "tool-trace";
        row.appendChild(trace);
      }
      const badge = document.createElement("span");
      badge.className = `tool-badge ${status}`;
      badge.dataset.tool = name;
      badge.dataset.callId = callId || `${name}-${Date.now()}`;
      badge.textContent = `工具 · ${name} · 第${step}步`;
      trace.appendChild(badge);
      messages.scrollTop = messages.scrollHeight;
      return badge;
    }

    function updateToolBadge(callId, name, step, ok) {
      const badge = messages.querySelector(`.tool-badge[data-call-id="${CSS.escape(callId)}"]`);
      if (!badge) return;
      badge.classList.remove("running");
      badge.classList.toggle("error", !ok);
      badge.textContent = `工具 · ${name} · 第${step}步 · ${ok ? "完成" : "失败"}`;
    }

    function parseSseBlock(block) {
      let event = "message";
      const data = [];
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
      }
      if (!data.length) return null;
      try { return { event, data: JSON.parse(data.join("\n")) }; }
      catch { return { event, data: { message: data.join("\n") } }; }
    }

    async function consumeStream(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const blocks = buffer.split("\n\n");
        buffer = blocks.pop() || "";
        for (const block of blocks) {
          const event = parseSseBlock(block);
          if (!event) continue;
          if (event.event === "meta" && event.data.session_id) {
            sessionId = event.data.session_id;
            currentRequestId = event.data.request_id || "";
            localStorage.setItem(SESSION_KEY, sessionId);
          } else if (event.event === "tool_status") {
            appendToolBadge(
              event.data.tool || "unknown",
              "running",
              event.data.step || 1,
              event.data.tool_call_id || "",
            );
            setStatus(`正在调用 ${event.data.tool || "工具"}…`);
          } else if (event.event === "tool_result") {
            updateToolBadge(
              event.data.tool_call_id || "",
              event.data.tool || "unknown",
              event.data.step || 1,
              Boolean(event.data.ok),
            );
          } else if (event.event === "sources") {
            currentCitations = Array.isArray(event.data.citations) ? event.data.citations : [];
          } else if (event.event === "delta") {
            ensureAssistantBubble();
            assistantBubble.dataset.rawText = (assistantBubble.dataset.rawText || "") + (event.data.text || "");
            assistantBubble.textContent += event.data.text || "";
            saveChatHistory();
            messages.scrollTop = messages.scrollHeight;
          } else if (event.event === "error") {
            throw new Error(event.data.message || "模型调用失败");
          } else if (event.event === "done") {
            if (assistantBubble) {
              assistantBubble.dataset.citations = JSON.stringify(currentCitations);
              assistantBubble.dataset.requestId = currentRequestId;
              renderAssistantBubble(assistantBubble);
              saveChatHistory();
            }
            const steps = Number(event.data.tool_steps || 0);
            setStatus(steps > 0 ? `已完成 · 共 ${steps} 步工具调用` : "已完成");
          }
        }
        if (done) break;
      }
      if (assistantBubble) assistantBubble.classList.remove("pending");
    }

    function clearConversationView() {
      messages.querySelectorAll(".message-row").forEach((node) => node.remove());
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(CHAT_HISTORY_KEY);
      sessionId = null;
      welcome.hidden = false;
    }

    async function sendMessage(message, canRetryExpiredSession = true) {
      setBusy(true);
      setStatus("客服正在思考…");
      assistantBubble = null;
      currentRequestId = "";
      currentCitations = [];
      addMessage("user", message);
      try {
        const response = await fetch("/api/v1/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
          body: JSON.stringify({ session_id: sessionId || null, message }),
        });
        if (!response.ok) {
          let detail = `请求失败（${response.status}）`;
          try { detail = (await response.json()).detail || detail; } catch {}
          if (response.status === 404 && sessionId && canRetryExpiredSession) {
            clearConversationView();
            setStatus("会话已过期，正在新建会话…");
            return await sendMessage(message, false);
          }
          throw new Error(detail);
        }
        await consumeStream(response);
      } catch (error) {
        if (assistantBubble) assistantBubble.classList.remove("pending");
        const messageText = error instanceof Error ? error.message : "请求失败，请稍后重试";
        setStatus(messageText, true);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    function setMode(mode) {
      const isChat = mode === "chat";
      const isExtract = mode === "extract";
      const isDatabase = mode === "database";
      messages.hidden = !isChat;
      composerWrap.hidden = !isChat;
      extractPanel.hidden = !isExtract;
      databasePanel.hidden = !isDatabase;
      chatMode.classList.toggle("active", isChat);
      extractMode.classList.toggle("active", isExtract);
      databaseMode.classList.toggle("active", isDatabase);
      chatMode.setAttribute("aria-selected", String(isChat));
      extractMode.setAttribute("aria-selected", String(isExtract));
      databaseMode.setAttribute("aria-selected", String(isDatabase));
      if (isChat) input.focus();
      else if (isExtract) extractInput.focus();
      else loadDatabaseTables();
    }

    function formatDatabaseValue(value) {
      if (value === null || value === undefined) return "NULL";
      if (typeof value === "object") return JSON.stringify(value, null, 0);
      return String(value);
    }

    async function loadDatabaseTables() {
      databaseStatus.classList.remove("error");
      databaseStatus.textContent = "正在读取数据库…";
      refreshTables.disabled = true;
      try {
        const response = await fetch("/api/v1/database/tables?limit=20");
        if (!response.ok) {
          let detail = `读取失败（${response.status}）`;
          try { detail = (await response.json()).detail || detail; } catch {}
          throw new Error(detail);
        }
        const data = await response.json();
        databaseGrid.replaceChildren();
        for (const table of data.tables) {
          const card = document.createElement("section");
          card.className = "database-card";
          const header = document.createElement("div");
          header.className = "database-card-header";
          const title = document.createElement("h3");
          title.textContent = table.name;
          const count = document.createElement("span");
          count.className = "database-count";
          count.textContent = `共 ${table.total} 条，显示最近 ${table.rows.length} 条`;
          header.append(title, count);
          card.appendChild(header);

          if (!table.rows.length) {
            const empty = document.createElement("div");
            empty.className = "database-empty";
            empty.textContent = "暂无数据";
            card.appendChild(empty);
          } else {
            const scroll = document.createElement("div");
            scroll.className = "table-scroll";
            const htmlTable = document.createElement("table");
            htmlTable.className = "database-table";
            const thead = document.createElement("thead");
            const headRow = document.createElement("tr");
            table.columns.forEach((column) => {
              const th = document.createElement("th");
              th.textContent = column;
              headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            const tbody = document.createElement("tbody");
            table.rows.forEach((row) => {
              const tr = document.createElement("tr");
              table.columns.forEach((column) => {
                const td = document.createElement("td");
                td.textContent = formatDatabaseValue(row[column]);
                td.title = td.textContent;
                tr.appendChild(td);
              });
              tbody.appendChild(tr);
            });
            htmlTable.append(thead, tbody);
            scroll.appendChild(htmlTable);
            card.appendChild(scroll);
          }
          databaseGrid.appendChild(card);
        }
        databaseStatus.textContent = "数据库读取完成";
      } catch (error) {
        databaseStatus.classList.add("error");
        databaseStatus.textContent = error instanceof Error ? error.message : "数据库读取失败";
      } finally {
        refreshTables.disabled = false;
      }
    }

    async function extractAfterSales() {
      const text = extractInput.value.trim();
      if (!text || extractButton.disabled) return;
      extractButton.disabled = true;
      extractStatus.classList.remove("error");
      extractStatus.textContent = "正在提取…";
      extractResult.hidden = true;
      try {
        const response = await fetch("/api/v1/after-sales/extract", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!response.ok) {
          let detail = `请求失败（${response.status}）`;
          try { detail = (await response.json()).detail || detail; } catch {}
          throw new Error(detail);
        }
        const data = await response.json();
        resultOrderId.textContent = data.order_id || "未识别";
        resultRequestType.textContent = data.request_type || "unknown";
        resultSolution.textContent = data.expected_solution || "未识别";
        extractResult.hidden = false;
        extractStatus.textContent = "提取完成";
      } catch (error) {
        extractStatus.classList.add("error");
        extractStatus.textContent = error instanceof Error ? error.message : "提取失败，请稍后重试";
      } finally {
        extractButton.disabled = false;
      }
    }

    chatMode.addEventListener("click", () => setMode("chat"));
    extractMode.addEventListener("click", () => setMode("extract"));
    databaseMode.addEventListener("click", () => setMode("database"));
    refreshTables.addEventListener("click", loadDatabaseTables);
    extractButton.addEventListener("click", extractAfterSales);

    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;
      input.value = "";
      sendMessage(message);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    restoreChatHistory();

    clearSession.addEventListener("click", () => {
      clearConversationView();
      setStatus("已新建会话");
      input.focus();
    });
  </script>
</body>
</html>
